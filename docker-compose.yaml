services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: balise
      POSTGRES_PASSWORD: balise
      POSTGRES_DB: balise
    ports: ["5433:5432"]
    volumes: ["balise-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balise"]
      interval: 3s
      retries: 20
volumes:
  balise-pg:
